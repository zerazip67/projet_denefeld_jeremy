<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <form id="formulaire">

            <div class="entete">
                <span class="badge">NOUVEAU COMPTE</span>
                <h1>Créer votre compte</h1>
                <p>Quelques informations et c'est parti.</p>
            </div>

            <p id="message"></p>

            <label for="login">Login</label>
            <input type="text" id="login" minlength="3" autocomplete="username" placeholder="Ex. aeaeaz48" required>
            <small>3 caractères minimum</small>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" autocomplete="new-password" required>

            <label for="confirmation">Confirmation du mot de passe</label>
            <input type="password" id="confirmation" autocomplete="new-password" required>

            <label for="nom">Nom</label>
            <input type="text" id="nom" required>

            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" required>

            <label for="adresse">Adresse</label>
            <input type="text" id="adresse" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="telephone">Téléphone</label>
            <input type="tel" id="telephone" inputmode="numeric" minlength="10" maxlength="10" pattern="[0-9]{10}" placeholder="Ex. 0612345678" required>
            <small>10 chiffres exactement</small>

            <label for="dateNaissance">Date de naissance</label>
            <input type="date" id="dateNaissance" required>

            <button type="submit">Créer mon compte <span aria-hidden="true">→</span></button>

        </form>


        <div id="recapitulatif">

            <div class="success-icon" aria-hidden="true">✓</div>
            <span class="badge badge-success">INSCRIPTION VALIDÉE</span>
            <h1>Bienvenue !</h1>
            <p class="intro-recap">Votre compte a bien été créé. Voici les informations enregistrées.</p>

            <div class="recap-grid">
                <p><strong>Login</strong><span id="recapLogin"></span></p>
                <p><strong>Nom</strong><span id="recapNom"></span></p>
                <p><strong>Prénom</strong><span id="recapPrenom"></span></p>
                <p><strong>Adresse</strong><span id="recapAdresse"></span></p>
                <p><strong>Email</strong><span id="recapEmail"></span></p>
                <p><strong>Téléphone</strong><span id="recapTelephone"></span></p>
                <p><strong>Date de naissance</strong><span id="recapDate"></span></p>
            </div>

        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
