<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

       <form id="formulaire">
        <h1>Créer un compte</h1>

        <label for="login">Login</label>
        <input type="text" id="login" placeholder="Votre login" required>

        <label for="nom">Nom</label>
        <input type="text" id="nom" placeholder="Votre nom" required>

        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" placeholder="Votre prénom" required>

        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp"
               placeholder="Minimum 8 caractères"
               minlength="8"
               required>

        <label for="confirmerPass">Confirmer le mot de passe</label>
        <input type="password" id="confirmerPass"
               placeholder="Retapez votre mot de passe"
               required>

        <label for="adresse">Adresse</label>
        <input type="text" id="adresse"
               placeholder="12 rue de la Paix"
               required>

        <label for="email">Email</label>
        <input type="email" id="email"
               placeholder="exemple@email.com"
               required>

       <label for="telephone">Téléphone <span class="indication">10 chiffres requis</span></label>
        <input type="tel" id="telephone"
               placeholder="0612345678"
               pattern="[0-9]{10}"
               maxlength="10"
               inputmode="numeric"
               required>

        <label for="date">Date de naissance</label>
        <input type="date" id="date" required>

        <button type="submit">S'inscrire</button>
    </form>


    <div id="resume">
        <h1>Récapitulatif</h1>

        <p><strong>Login :</strong> <span id="resume-login"></span></p>
        <p><strong>Nom :</strong> <span id="resume-nom"></span></p>
        <p><strong>Prénom :</strong> <span id="resume-prenom"></span></p>
        <p><strong>Adresse :</strong> <span id="resume-adresse"></span></p>
        <p><strong>Email :</strong> <span id="resume-email"></span></p>
        <p><strong>Téléphone :</strong> <span id="resume-telephone"></span></p>
        <p><strong>Date de naissance :</strong> <span id="resume-date"></span></p>
    </div>

    <script src="../back/script.js"></script>

</body>
</html>
