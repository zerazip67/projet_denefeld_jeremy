databases:
  - name: pollution-db
    databaseName: pollution_db
    user: pollution_user
    plan: free
    region: oregon

services:
  - type: web
    name: pollution-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.3
      - key: DATABASE_URL
        fromDatabase:
          name: pollution-db
          property: connectionString
