<section class="signup-card">
  <p class="eyebrow">EXERCICE 02</p>
  <h2>Créer un compte</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Nom
      <input type="text" formControlName="name" autocomplete="name">
      @if (form.controls.name.touched && form.controls.name.hasError('required')) {
        <small>Le nom est obligatoire.</small>
      }
    </label>

    <label>
      Adresse e-mail
      <input type="email" formControlName="email" autocomplete="email">
      @if (form.controls.email.touched && form.controls.email.hasError('required')) {
        <small>L'adresse e-mail est obligatoire.</small>
      } @else if (form.controls.email.touched && form.controls.email.hasError('email')) {
        <small>Saisissez une adresse e-mail valide.</small>
      }
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="password" autocomplete="new-password">
      @if (form.controls.password.touched && form.controls.password.hasError('required')) {
        <small>Le mot de passe est obligatoire.</small>
      } @else if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
        <small>Le mot de passe doit contenir au moins 8 caractères.</small>
      }
    </label>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Inscription en cours...' : "S'inscrire" }}
    </button>
  </form>

  @if (successMessage) {
    <p class="feedback success" role="status">{{ successMessage }}</p>
  }
  @if (errorMessage) {
    <p class="feedback error" role="alert">{{ errorMessage }}</p>
  }
</section>
