<main class="page">
  <header>
    <div>
      <h1>Déclarer une pollution</h1>
      <p class="intro">
        {{ inscrit ? 'Gérez les déclarations de pollution.' : 'Connectez-vous ou créez un compte pour continuer.' }}
      </p>
    </div>
  </header>

  @if (!inscrit) {
    <app-auth-form (authentificationReussie)="terminerInscription()" />
  } @else {
    <app-pollution-dashboard />
  }
</main>
